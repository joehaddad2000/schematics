<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order request path</title>
  <style>
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 28px; }
    svg { display: block; width: min(100%, 960px); height: auto; }
  </style>
</head>
<body>
  <h1>Order request path</h1>
  <!-- schematics:embed:start -->
  <svg viewBox="0 0 960 600" role="img" aria-labelledby="request-path-title request-path-desc">
    <title id="request-path-title">Order request path</title>
    <desc id="request-path-desc">The Order API writes an accepted order to the order store.</desc>
    <defs>
      <marker id="request-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#f5f5f5"/>
    <path d="M 376 300 H 584" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#request-arrow)"/>
    <rect x="448" y="268" width="64" height="16" rx="2" fill="#f5f5f5"/>
    <text x="480" y="280" fill="#4f5d75" font-size="12" text-anchor="middle">WRITES</text>
    <g data-schematic-id="order-api">
      <rect x="136" y="236" width="240" height="128" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="2"/>
      <text x="256" y="290" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">Order API</text>
      <g data-schematic-view="api-internals">
        <rect x="172" y="318" width="168" height="28" rx="4" fill="#fff3ed" stroke="#eb6c36"/>
        <text x="256" y="337" fill="#9a3d19" font-size="11" font-weight="600" text-anchor="middle">EXPLORE INTERNALS →</text>
      </g>
    </g>
    <g data-schematic-id="order-store">
      <rect x="584" y="236" width="240" height="128" rx="8" fill="#e8e9ec" stroke="#4f5d75" stroke-width="2"/>
      <text x="704" y="304" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">Order store</text>
    </g>
  </svg>
  <!-- schematics:embed:end -->
</body>
</html>
