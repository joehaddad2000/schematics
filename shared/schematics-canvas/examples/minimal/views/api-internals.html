<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order API internals</title>
  <style>
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 28px; }
    svg { display: block; width: min(100%, 960px); height: auto; }
  </style>
</head>
<body>
  <h1>Order API internals</h1>
  <!-- schematics:embed:start -->
  <svg viewBox="0 0 960 600" role="img" aria-labelledby="api-title api-desc">
    <title id="api-title">Order API internals</title>
    <desc id="api-desc">The order handler applies the idempotency policy before it accepts an order.</desc>
    <defs>
      <marker id="api-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#f5f5f5"/>
    <path d="M 376 300 H 584" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#api-arrow)"/>
    <rect x="426" y="268" width="108" height="16" rx="2" fill="#f5f5f5"/>
    <text x="480" y="280" fill="#4f5d75" font-size="12" text-anchor="middle">CHECKS KEY</text>
    <g data-schematic-id="order-handler">
      <rect x="136" y="236" width="240" height="128" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="2"/>
      <text x="256" y="304" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">Order handler</text>
    </g>
    <g data-schematic-id="idempotency-policy">
      <rect x="584" y="236" width="240" height="128" rx="8" fill="#e8e9ec" stroke="#4f5d75" stroke-width="2"/>
      <text x="704" y="304" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">Idempotency policy</text>
    </g>
    <g data-schematic-view="request-path">
      <rect x="36" y="32" width="160" height="32" rx="4" fill="#ffffff" stroke="#4f5d75"/>
      <text x="116" y="53" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">← SYSTEM VIEW</text>
    </g>
  </svg>
  <!-- schematics:embed:end -->
</body>
</html>
