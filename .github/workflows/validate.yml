name: Validate skill collection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check skills.sh discovery
        run: npx --yes skills add . --list

      - name: Check Claude manifest syntax
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null

      - name: Check shared canvas code
        run: |
          python -m py_compile shared/schematics-canvas/scripts/build_canvas.py
          node --check shared/schematics-canvas/assets/schematics-canvas/app.js

      - name: Build a canvas artifact
        run: |
          artifact_dir="$(mktemp -d)"
          cp -R shared/schematics-canvas/examples/minimal/. "$artifact_dir/"
          python shared/schematics-canvas/scripts/build_canvas.py "$artifact_dir/canvas-manifest.json"
          test -f "$artifact_dir/index.html"
          test -f "$artifact_dir/canvas-data.js"
          node --check "$artifact_dir/app.js"

      - name: Reject invalid canvas contracts
        run: |
          for case_name in missing-marker missing-view empty-view; do
            artifact_dir="$(mktemp -d)"
            cp -R shared/schematics-canvas/examples/minimal/. "$artifact_dir/"
            python - "$artifact_dir" "$case_name" <<'PY'
          import json
          import pathlib
          import sys

          artifact = pathlib.Path(sys.argv[1])
          case_name = sys.argv[2]
          if case_name == "missing-marker":
              path = artifact / "canvas-manifest.json"
              data = json.loads(path.read_text())
              data["views"][0]["nodes"][0]["id"] = "missing-marker"
              path.write_text(json.dumps(data, indent=2) + "\n")
          else:
              path = artifact / "views/request-path.html"
              target = "missing-view" if case_name == "missing-view" else ""
              path.write_text(
                  path.read_text().replace(
                      'data-schematic-view="api-internals"',
                      f'data-schematic-view="{target}"',
                  )
              )
          PY
            if python shared/schematics-canvas/scripts/build_canvas.py "$artifact_dir/canvas-manifest.json"; then
              echo "Builder accepted invalid canvas contract: $case_name" >&2
              exit 1
            fi
          done

      - name: Check individual interactive skill installation
        run: |
          for skill in visual-plan map-codebase explain-pr; do
            install_dir="$(mktemp -d)"
            git -C "$install_dir" init -b main >/dev/null
            (
              cd "$install_dir"
              npx --yes skills add "$GITHUB_WORKSPACE" --skill "$skill" --agent codex --copy --yes
            )
            installed="$install_dir/.agents/skills/$skill"
            test -f "$installed/assets/schematics-canvas/index.html"
            test -f "$installed/references/canvas-format.md"
            test -f "$installed/scripts/build_canvas.py"
            artifact_dir="$(mktemp -d)"
            cp -R "$GITHUB_WORKSPACE/shared/schematics-canvas/examples/minimal/." "$artifact_dir/"
            python "$installed/scripts/build_canvas.py" "$artifact_dir/canvas-manifest.json"
            test -f "$artifact_dir/index.html"
            test -f "$artifact_dir/canvas-data.js"
          done
